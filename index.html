<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রক্তদাতা ও জরুরি তথ্য নিবন্ধন ফর্ম - জীবন বাঁচান</title>
    
    <!-- সোশ্যাল মিডিয়া শেয়ার প্রিভিউ ট্যাগ -->
    <meta property="og:title" content="রক্তদাতা ও জরুরি তথ্য নিবন্ধন ফর্ম">
    <meta property="og:description" content="জরুরি প্রয়োজনে রক্তদাতা খুঁজে পেতে বা রক্তদান করতে আপনার সঠিক তথ্য দিয়ে সহযোগিতা করুন। হটলাইন: ০১৯৮০-২৯২৫৬১">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ranadevloper.github.io/rokto-dan/">

    <style>
        body { font-family: 'SolaimanLipi', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; background: #fff; margin: 0 auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #d9534f; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 12px; font-size: 14px; }
        .hotline-box { text-align: center; margin-bottom: 25px; }
        .hotline-badge { display: inline-block; background-color: #fdf2f2; color: #d9534f; border: 1px solid #f5c6cb; padding: 8px 20px; border-radius: 25px; font-weight: bold; font-size: 16px; text-decoration: none; box-shadow: 0 2px 5px rgba(217, 83, 79, 0.2); }
        .hotline-badge:hover { background-color: #d9534f; color: #fff; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #d9534f; color: white; border: none; padding: 12px 20px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #c9302c; }
    </style>
</head>
<body>

<div class="container">
    <h2>🩸 রক্তদাতা ও জরুরি তথ্য নিবন্ধন ফর্ম</h2>
    <p class="subtitle">জরুরি প্রয়োজনে রক্তদাতা খুঁজে পেতে আপনার সঠিক তথ্য দিয়ে সহযোগিতা করুন।</p>
    
    <div class="hotline-box">
        <a href="tel:01980292561" class="hotline-badge">📞 জরুরি হটলাইন: ০১৯৮০-২৯২৫৬১</a>
    </div>
    
    <form id="donorForm">
        <div class="form-group">
            <label>নাম *</label>
            <input type="text" name="name" required placeholder="আপনার পুরো নাম লিখুন">
        </div>

        <div class="form-group">
            <label>রক্তের গ্রুপ *</label>
            <select name="bloodGroup" required>
                <option value="">রক্তের গ্রুপ নির্বাচন করুন</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
        </div>

        <div class="form-group">
            <label>মোবাইল নম্বর *</label>
            <input type="tel" name="phone" required placeholder="আপনার মোবাইল নম্বর">
        </div>

        <div class="form-group">
            <label>বয়স *</label>
            <input type="number" name="age" required placeholder="আপনার বয়স">
        </div>

        <div class="form-group">
            <label>জেলা (Searchable) *</label>
            <input type="text" name="district" required placeholder="জেলা টাইপ করুন (যেমন: ঢাকা)" list="districtList">
            <datalist id="districtList">
                <option value="ঢাকা (Dhaka)">
                <option value="ফরিদপুর (Faridpur)">
                <option value="গাজীপুর (Gazipur)">
                <option value="গোপালগঞ্জ (Gopalganj)">
                <option value="কিশোরগঞ্জ (Kishoreganj)">
                <option value="মাদারীপুর (Madaripur)">
                <option value="মানিকগঞ্জ (Manikganj)">
                <option value="মুন্সীগঞ্জ (Munshiganj)">
                <option value="নারায়ণগঞ্জ (Narayanganj)">
                <option value="নরসিংদী (Narsingdi)">
                <option value="রাজবাড়ী (Rajbari)">
                <option value="শরীয়তপুর (Shariatpur)">
                <option value="টাঙ্গাইল (Tangail)">
                <option value="বাগেরহাট (Bagerhat)">
                <option value="চুয়াডাঙ্গা (Chuadanga)">
                <option value="যশোর (Jashore)">
                <option value="ঝিনাইদহ (Jhenaidah)">
                <option value="খুলনা (Khulna)">
                <option value="কুষ্টিয়া (Kushtia)">
                <option value="মাগুরা (Magura)">
                <option value="মেহেরপুর (Meherpur)">
                <option value="নড়াইল (Narail)">
                <option value="সাতক্ষীরা (Satkhira)">
                <option value="বগুড়া (Bogura)">
                <option value="জয়পুরহাট (Joypurhat)">
                <option value="নওগাঁ (Naogaon)">
                <option value="নাটোর (Natore)">
                <option value="চাঁপাইনবাবগঞ্জ (Chapainawabganj)">
                <option value="পাবনা (Pabna)">
                <option value="রাজশাহী (Rajshahi)">
                <option value="সিরাজগঞ্জ (Sirajganj)">
                <option value="দিনাজপুর (Dinajpur)">
                <option value="গাইবান্ধা (Gaibandha)">
                <option value="কুড়িগ্রাম (Kurigram)">
                <option value="লালমনিরহাট (Lalmonirhat)">
                <option value="নীলফামারী (Nilphamari)">
                <option value="পঞ্চগড় (Panchagarh)">
                <option value="রংপুর (Rangpur)">
                <option value="ঠাকুরগাঁও (Thakurgaon)">
                <option value="বরগুনা (Barguna)">
                <option value="বরিশাল (Barishal)">
                <option value="ভোলা (Bhola)">
                <option value="ঝালকাঠি (Jhalokati)">
                <option value="পটুয়াখালী (Patuakhali)">
                <option value="পিরোজপুর (Pirojpur)">
                <option value="বান্দরবান (Bandarban)">
                <option value="ব্রাহ্মণবাড়িয়া (Brahmanbaria)">
                <option value="চাঁদপুর (Chandpur)">
                <option value="চট্টগ্রাম (Chattogram)">
                <option value="কুমিল্লা (Cumilla)">
                <option value="কক্সবাজার (Cox's Bazar)">
                <option value="ফেনী (Feni)">
                <option value="খাগড়াছড়ি (Khagrachhari)">
                <option value="লক্ষ্মীপুর (Lakshmipur)">
                <option value="নোয়াখালী (Noakhali)">
                <option value="রাঙ্গামাটি (Rangamati)">
                <option value="হবিগঞ্জ (Habiganj)">
                <option value="মৌলভীবাজার (Moulvibazar)">
                <option value="সুনামগঞ্জ (Sunamganj)">
                <option value="সিলেট (Sylhet)">
                <option value="জামালপুর (Jamalpur)">
                <option value="ময়মনসিংহ (Mymensingh)">
                <option value="নেত্রকোণা (Netrokona)">
                <option value="শেরপুর (Sherpur)">
            </datalist>
        </div>

        <div class="form-group">
            <label>ইউনিয়ন / এলাকা</label>
            <input type="text" name="union" placeholder="আপনার ইউনিয়ন বা এলাকার নাম">
        </div>

        <div class="form-group">
            <label>আপনি কি নিয়মিত রক্তদাতা?</label>
            <select name="regularDonor">
                <option value="হ্যাঁ">হ্যাঁ</option>
                <option value="না">না</option>
            </select>
        </div>

        <div class="form-group">
            <label>সর্বশেষ কত দিন আগে এবং কতবার রক্তদান করেছেন? (ঐচ্ছিক)</label>
            <input type="text" name="donationHistory" placeholder="যেমন: ৩ মাস আগে, ২ বার">
        </div>

        <button type="submit">নিবন্ধন করুন</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxfAypxCOLSAbJM0SLlD50CnWsK90bFTqtUwhrI07A7cTvaimFAYubeCnYxyHCSBfFmDA/exec';
    const form = document.getElementById('donorForm');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        const submitBtn = form.querySelector('button[type="submit"]');
        let originalText = submitBtn.innerText;
        submitBtn.innerText = 'তথ্য জমা হচ্ছে, অপেক্ষা করুন...';
        submitBtn.disabled = true;

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(form))) })
            .then(response => {
                alert('ধন্যবাদ! আপনার রক্তদানের তথ্য সফলভাবে জমা হয়েছে।');
                form.reset();
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('দুঃখিত, তথ্য জমা দিতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            });
    });
</script>

</body>
</html>
