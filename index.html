<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rana Bhai's Pro Scientific Calculator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #1a1a2e; margin: 0; padding: 20px; }
        .calculator { background-color: #16213e; padding: 20px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); width: 360px; }
        
        #display { width: 100%; height: 65px; font-size: 28px; text-align: right; margin-bottom: 5px; padding: 15px; border: none; border-radius: 12px; background: #e94560; color: white; box-sizing: border-box; font-weight: bold; }
        #realTimeResult { width: 100%; height: 25px; font-size: 18px; text-align: right; color: #0f3460; margin-bottom: 15px; font-weight: bold; padding-right: 15px; background: #95adbe; border-radius: 5px; display: flex; align-items: center; justify-content: flex-end; }

        .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        
        button { padding: 15px 5px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; background-color: #0f3460; color: white; font-weight: 600; }
        button:hover { background-color: #533483; transform: translateY(-2px); }
        
        .operator { background-color: #e94560; }
        .sci-btn { background-color: #0077b6; font-size: 14px; }
        .equal { background-color: #27ae60; grid-column: span 2; }
        .clear { background-color: #d63031; }
        .del { background-color: #f39c12; }

        .history-container { width: 360px; margin-top: 20px; background: #f1f2f6; border-radius: 15px; padding: 15px; box-sizing: border-box; }
        .history-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ddd; padding-bottom: 8px; margin-bottom: 10px; }
        .history-header h3 { margin: 0; font-size: 18px; color: #2c3e50; }
        .clear-history-btn { background: #d63031; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        #historyList { max-height: 180px; overflow-y: auto; }
        .history-item { font-size: 14px; color: #333; padding: 8px 0; border-bottom: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" placeholder="0" disabled>
    <div id="realTimeResult"></div>
    
    <div class="buttons">
        <button class="sci-btn" onclick="sciCalc('sin')">sin</button>
        <button class="sci-btn" onclick="sciCalc('cos')">cos</button>
        <button class="sci-btn" onclick="sciCalc('tan')">tan</button>
        <button class="sci-btn" onclick="sciCalc('log')">log</button>
        <button class="sci-btn" onclick="sciCalc('sqrt')">√</button>

        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="del" onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="addToDisplay('%')">%</button>
        <button class="operator" onclick="addToDisplay('/')">÷</button>
        <button class="sci-btn" onclick="sciCalc('pow')">x²</button>

        <button onclick="addToDisplay('7')">7</button>
        <button onclick="addToDisplay('8')">8</button>
        <button onclick="addToDisplay('9')">9</button>
        <button class="operator" onclick="addToDisplay('*')">×</button>
        <button class="sci-btn" onclick="sciCalc('pi')">π</button>

        <button onclick="addToDisplay('4')">4</button>
        <button onclick="addToDisplay('5')">5</button>
        <button onclick="addToDisplay('6')">6</button>
        <button class="operator" onclick="addToDisplay('-')">−</button>
        <button class="sci-btn" onclick="addToDisplay('(')">(</button>

        <button onclick="addToDisplay('1')">1</button>
        <button onclick="addToDisplay('2')">2</button>
        <button onclick="addToDisplay('3')">3</button>
        <button class="operator" onclick="addToDisplay('+')">+</button>
        <button class="sci-btn" onclick="addToDisplay(')')">)</button>

        <button onclick="addToDisplay('0')">0</button>
        <button onclick="addToDisplay('.')">.</button>
        <button class="equal" onclick="finalCalculate()">=</button>
    </div>
</div>

<div class="history-container">
    <div class="history-header">
        <h3>History Archive</h3>
        <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
    </div>
    <div id="historyList"></div>
</div>

<script>
    let display = document.getElementById('display');
    let realTimeResult = document.getElementById('realTimeResult');
    let historyList = document.getElementById('historyList');

    window.onload = function() {
        let savedHistory = JSON.parse(localStorage.getItem('calcHistory')) || [];
        savedHistory.forEach(item => renderHistoryItem(item));
    };

    function addToDisplay(value) {
        display.value += value;
        updateRealTime();
    }

    function clearDisplay() {
        display.value = '';
        realTimeResult.innerText = '';
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);
        updateRealTime();
    }

    // সায়েন্টিফিক ফাংশনাল লজিক
    function sciCalc(type) {
        if (display.value === "" && type !== 'pi') return;
        
        let val = parseFloat(display.value);
        let res = 0;
        
        switch(type) {
            case 'sin': res = Math.sin(val * Math.PI / 180); break; // Degrees
            case 'cos': res = Math.cos(val * Math.PI / 180); break;
            case 'tan': res = Math.tan(val * Math.PI / 180); break;
            case 'log': res = Math.log10(val); break;
            case 'sqrt': res = Math.sqrt(val); break;
            case 'pow': res = Math.pow(val, 2); break;
            case 'pi': addToDisplay(Math.PI.toFixed(4)); return;
        }
        display.value = res;
        updateRealTime();
    }

    // আপনার কাস্টম পার্সেন্টেজ লজিক
    function parseExpression(expr) {
        if (expr.includes('%')) {
            let parts = expr.split('%');
            if (parts.length === 2 && parts[1] !== "") {
                return "(" + parts[0] + "*" + parts[1] + ")/100";
            }
        }
        return expr;
    }

    function updateRealTime() {
        try {
            let expression = display.value;
            if (expression === "" || expression.endsWith('%')) {
                realTimeResult.innerText = "";
                return;
            }
            let result = eval(parseExpression(expression));
            if (result !== undefined) {
                realTimeResult.innerText = "= " + result;
            }
        } catch (e) {
            realTimeResult.innerText = "";
        }
    }

    function finalCalculate() {
        try {
            let expression = display.value;
            if (expression === "") return;
            
            let result = eval(parseExpression(expression));
            let historyData = expression + " = " + result;
            
            saveToLocalStorage(historyData);
            renderHistoryItem(historyData, true);

            display.value = result;
            realTimeResult.innerText = "";
        } catch (error) {
            display.value = "Error";
        }
    }

    function renderHistoryItem(data, isNew = false) {
        let newItem = document.createElement('div');
        newItem.className = 'history-item';
        let parts = data.split('=');
        newItem.innerHTML = parts[0] + " = <b>" + parts[1] + "</b>";
        if (isNew) historyList.prepend(newItem);
        else historyList.appendChild(newItem);
    }

    function saveToLocalStorage(data) {
        let savedHistory = JSON.parse(localStorage.getItem('calcHistory')) || [];
        savedHistory.unshift(data); 
        localStorage.setItem('calcHistory', JSON.stringify(savedHistory));
    }

    function clearHistory() {
        localStorage.removeItem('calcHistory');
        historyList.innerHTML = "";
    }
</script>

</body>
</html>
